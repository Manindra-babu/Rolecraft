<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ResumeIQ Extension</title>
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #FAFAF8;
      color: #1F2933;
      width: 320px;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px 0;
    }
    p {
      font-size: 12px;
      color: #5F6B76;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #E5E5E0;
      border-radius: 6px;
      background: #FFFFFF;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      background: #0F5C6E;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    .status.ok {
      display: block;
      background: #ECFDF5;
      color: #15803D;
      border: 1px solid #BBF7D0;
    }
    .status.err {
      display: block;
      background: #FEF2F2;
      color: #B91C1C;
      border: 1px solid #FECACA;
    }
  </style>
</head>
<body>
  <h1>ResumeIQ</h1>
  <p>Send the job posting open in this tab directly to your ResumeIQ workspace.</p>

  <label for="apiUrl">API URL</label>
  <input id="apiUrl" type="url" value="http://localhost:8000/api/v1" />

  <label for="token">ResumeIQ Session Token</label>
  <input id="token" type="password" placeholder="Paste token from Settings / localStorage" />

  <button id="captureBtn" type="button">Add to ResumeIQ</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
