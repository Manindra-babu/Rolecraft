[project]
name = "resumeiq-api"
version = "0.1.0"
description = "ResumeIQ FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.0",
    "redis>=5.1.0",
    "rq>=1.16.2",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "python-docx>=1.1.2",
    "pdfplumber>=0.11.4",
    "PyMuPDF>=1.24.10",
    "httpx>=0.27.2",
    "selectolax>=0.3.25",
    "trafilatura>=1.12.2",
    "extruct>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
